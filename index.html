<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Question</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    font-family:Arial,sans-serif;
    background:#ffe6f0;
    overflow:hidden;
}

h1{
    color:#ff1493;
    text-align:center;
}

button{
    padding:12px 25px;
    margin:10px;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

#yes{
    background:#4CAF50;
    color:white;
}

#no{
    background:#ff4d4d;
    color:white;
    position:absolute;
}
</style>
</head>

<body>

<h1>Do You Love Me? ❤️</h1>

<button id="yes" onclick="yesClick()">Yes ❤️</button>
<button id="no" onmouseover="moveButton()">No 😅</button>

<script>
function yesClick(){
    document.body.innerHTML =
    "<h1 style='color:#ff1493'>Aww ❤️ Thank You!</h1>";
}

function moveButton(){
    let btn=document.getElementById("no");

    let x=Math.random()*(window.innerWidth-100);
    let y=Math.random()*(window.innerHeight-50);

    btn.style.left=x+"px";
    btn.style.top=y+"px";
}
</script>

</body>
</html>
